<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Visión Artificial</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <div class="panel">
        <div class="img-cnt">
            <img id="live-stream" class="viewport" alt="Cargando canal de video...">
        </div>    
        <div id="indicator" class="msg">Estado: Conectando...</div>
    </div>
    <div>
        <div class="cmd-cnt">
            <label class="Title">Controls</label>
            <button id="runonce">Run Once</button>
            <button id="run">Run</button>
            <button id="stop">Stop</button>
            <div id="cnt-s">
                <div class="s1">
                    <select name="config" id="cnf">
                        <option>Exposition</option>
                        <option>Gamma</option>
                        <option>Noise Filter</option>
                        <option>Saturation</option>
                        <option>Gain</option>
                        <option>Contrast</option>
                    </select>
                    <input class="num" type="number" id="data"/>
                </div>
                <div class="s2">
                    <button id="get">Get</button>
                    <button id="send">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="stream.js"></script>
</body>
</html>
